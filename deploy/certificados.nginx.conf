# Nginx site para la Plataforma de Certificados.
# certbot --nginx agrega/gestiona el bloque 443 y el redirect 80->443.
server {
    listen 80;
    listen [::]:80;
    server_name srv1812254.hstgr.cloud;

    client_max_body_size 60M;  # subida de PDF de plantillas y export de inscriptos (xls-HTML puede pesar 20-30MB+)

    # Página estática para cuando la app (gunicorn) está caída/no responde.
    # Complementa el modo mantenimiento de Django (que solo corre si la app vive).
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/certificados-fallback;
        internal;
    }

    location /static/ {
        alias /opt/certificados/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /opt/certificados/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://unix:/run/certificados/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # El PDF (~370 KB) y el JPEG (~220 KB) se bufferizan enteros en RAM:
        # nginx libera al worker de gunicorn al instante y se ocupa él de
        # servirle al celular lento. Con los buffers default (8x8k) pasaban
        # por archivo temporal.
        proxy_buffers 32 32k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 128k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
