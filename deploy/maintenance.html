<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicio no disponible</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #ffffff; color: #1a1d23; padding: 24px;
        }
        .box { max-width: 460px; width: 100%; text-align: center;
               border: 2px solid #000; border-radius: 16px; padding: 48px 36px; }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 14px; color: #1d4ed8; }
        p { font-size: 15px; line-height: 1.6; color: #4b5563; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Servicio no disponible por un momento</h1>
        <p>Estamos recibiendo muchas visitas en este momento. Volver a intentar en unos minutos.</p>
    </div>
</body>
</html>
