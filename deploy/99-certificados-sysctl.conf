# Colas de conexión para picos de descargas (prueba de carga 06-10-2026:
# 5.000 personas a la vez). somaxconn es el tope real del --backlog de
# gunicorn y del backlog de nginx; tcp_max_syn_backlog evita el
# "Possible SYN flooding" del kernel ante una avalancha legítima.
# Instalar: install -m 644 deploy/99-certificados-sysctl.conf /etc/sysctl.d/ && sysctl --system
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
