<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>No pudimos verificar el envío</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #1a1d23;
            padding: 24px;
        }
        .box {
            max-width: 460px;
            width: 100%;
            text-align: center;
            border: 2px solid #000;
            border-radius: 16px;
            padding: 48px 36px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 14px;
            color: #1d4ed8;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 10px;
        }
        a {
            color: #1d4ed8;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>No pudimos verificar el envío</h1>
        <p>Puede pasar cuando el navegador bloquea cookies o la página estuvo abierta mucho tiempo.</p>
        <p><a href="{{ retry_url }}">Tocar acá para abrir el formulario de nuevo</a> y volver a intentar.</p>
    </div>
</body>
</html>
